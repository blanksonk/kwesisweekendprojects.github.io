document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"50690871-03be-4f45-922f-efe16f041494\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  @keyframes kwp-rise { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes kwp-riseBlur { from { opacity:0; transform:translateY(34px); filter:blur(16px); } to { opacity:1; transform:translateY(0); filter:blur(0); } }\n  @keyframes kwp-fade { from { opacity:0; } to { opacity:1; } }\n  @keyframes kwp-navDrop { from { opacity:0; transform:translateY(-110%); } to { opacity:1; transform:translateY(0); } }\n  @keyframes kwp-floatA { 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(46px,-34px) scale(1.1);} 100%{transform:translate(0,0) scale(1);} }\n  @keyframes kwp-floatB { 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(-40px,30px) scale(1.07);} 100%{transform:translate(0,0) scale(1);} }\n  html, body { margin:0; padding:0; }\n  body {\n    font-family:-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI\", Helvetica, sans-serif;\n    color:#1d1d1f;\n    background:#fbfbfd;\n    -webkit-font-smoothing:antialiased;\n    text-rendering:optimizeLegibility;\n    -webkit-text-size-adjust:100%;\n  }\n  input, textarea, select { font-family:inherit; font-size:16px; }\n  ::selection { background:rgba(53,110,255,0.16); }\n  @media (max-width:640px) {\n    nav { padding:0 14px !important; }\n    .kwp-card-outer { width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; min-width: 0 !important; }\n    .kwp-card-inner { border-radius: 18px !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#fbfbfd;\">\n\n  <!-- ======== PROJECT LIST APP (revealed after Explore) ======== -->\n  <sc-if value=\"{{ entered }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n\n      <div style=\"position:relative; z-index:1;\">\n      <!-- click-away overlay for menu -->\n      <div onclick=\"{{ closeMenu }}\" style=\"{{ overlayStyle }}\"><\u002Fdiv>\n\n      <!-- top nav -->\n      <nav style=\"position:fixed; top:0; left:0; right:0; height:54px; display:flex; align-items:center; gap:14px; padding:0 22px; z-index:50; background:rgba(251,251,253,0.72); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid rgba(0,0,0,0.06); animation:kwp-navDrop .8s cubic-bezier(.16,1,.3,1) both;\">\n        <button onclick=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"position:relative; width:34px; height:34px; border:none; background:transparent; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;\">\n          <span style=\"{{ line1Style }}\"><\u002Fspan>\n          <span style=\"{{ line2Style }}\"><\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ goHome }}\" style=\"border:none; background:transparent; cursor:pointer; padding:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#1d1d1f;\">Kwesi<span style=\"color:{{ acc }};\">’s<\u002Fspan><span style=\"color:#86868b; font-weight:500;\"> weekend projects<\u002Fspan><\u002Fbutton>\n      <\u002Fnav>\n\n      <!-- dropdown menu (top-left) -->\n      <div style=\"{{ menuPanelStyle }}\">\n        <div style=\"padding:8px;\">\n          <sc-for list=\"{{ navLinks }}\" as=\"item\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ item.onClick }}\" style=\"{{ item.style }}\" style-hover=\"background:#f2f2f5;\">\n              <span>{{ item.label }}<\u002Fspan>\n              <span style=\"{{ item.dotStyle }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <div style=\"height:1px; background:rgba(0,0,0,0.07); margin:8px 12px;\"><\u002Fdiv>\n          <button onclick=\"{{ openZipline }}\" style=\"width:100%; text-align:left; border:none; cursor:pointer; padding:12px 14px; border-radius:11px; font-size:14.5px; font-weight:600; color:{{ acc }}; background:rgba(0,0,0,0.025); display:flex; align-items:center; justify-content:space-between; gap:10px;\" style-hover=\"background:rgba(0,0,0,0.05);\">\n            <span>I’m just here for the zipline<\u002Fspan>\n            <span style=\"font-size:15px; line-height:1;\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- about panel -->\n      <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:fixed; inset:0; z-index:12; background:#fbfbfd; overflow-y:auto; animation:kwp-fade .45s ease both;\">\n          <div style=\"max-width:620px; margin:0 auto; padding:130px 28px 120px;\">\n            <div style=\"font-size:11px; font-weight:600; letter-spacing:0.14em; color:{{ acc }}; text-transform:uppercase; margin-bottom:24px; animation:kwp-rise .8s cubic-bezier(.16,1,.3,1) both; animation-delay:.05s;\">About<\u002Fdiv>\n            <h1 style=\"margin:0 0 32px; font-size:clamp(48px,8vw,92px); line-height:0.98; font-weight:600; letter-spacing:-0.04em; color:#1d1d1f; animation:kwp-riseBlur .9s cubic-bezier(.16,1,.3,1) both; animation-delay:.1s;\">Kwesi.<\u002Fh1>\n            <p style=\"margin:0; font-size:clamp(17px,1.9vw,20px); line-height:1.75; color:#3a3a3f; max-width:540px; text-wrap:pretty; animation:kwp-rise .8s cubic-bezier(.16,1,.3,1) both; animation-delay:.22s;\">Your paragraph about yourself goes here. Write whatever you’d like people to know — what drives you, what you think about, what a weekend looks like for you.<\u002Fp>\n            <a href=\"{{ igLink }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex; align-items:center; gap:11px; margin-top:48px; padding:14px 24px; border-radius:100px; background:#1d1d1f; color:#fff; text-decoration:none; font-size:16px; font-weight:500; letter-spacing:-0.01em; transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; animation:kwp-rise .8s cubic-bezier(.16,1,.3,1) both; animation-delay:.34s;\" style-hover=\"transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,0.18);\">\n              <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"6\" ry=\"6\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"5\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n              <span>@{{ igHandle }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- list header -->\n      <header style=\"max-width:960px; margin:0 auto; padding:118px 28px 4px; animation:kwp-fade .9s ease both;\">\n        <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; color:{{ acc }}; text-transform:uppercase;\">The archive<\u002Fdiv>\n        <h1 style=\"margin:14px 0 0; font-size:clamp(32px,5vw,56px); line-height:1.04; font-weight:600; letter-spacing:-0.03em; color:#1d1d1f; text-wrap:pretty;\">Things I’ve spent my weekend(s) on.<\u002Fh1>\n      <\u002Fheader>\n\n      <!-- controls -->\n      <section style=\"max-width:960px; margin:0 auto; padding:30px 28px 4px; animation:kwp-fade .9s ease both; animation-delay:.1s;\">\n        <div style=\"position:relative; max-width:440px;\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"position:absolute; left:16px; top:50%; transform:translateY(-50%); pointer-events:none;\"><circle cx=\"11\" cy=\"11\" r=\"7\" fill=\"none\" stroke=\"#a1a1a8\" stroke-width=\"2\"><\u002Fcircle><line x1=\"16.5\" y1=\"16.5\" x2=\"21\" y2=\"21\" stroke=\"#a1a1a8\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n          <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search projects, tags, ideas…\" style=\"width:100%; box-sizing:border-box; height:46px; padding:0 44px; border-radius:23px; border:1px solid #e4e4ea; background:#fff; font-size:16px; color:#1d1d1f; outline:none; transition:border-color .2s ease, box-shadow .2s ease;\" style-focus=\"border-color:#c7c7cf; box-shadow:0 0 0 4px rgba(0,0,0,0.04);\">\n          <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ clearSearch }}\" aria-label=\"Clear\" style=\"position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:none; background:#ececf0; border-radius:50%; cursor:pointer; color:#6e6e76; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;\" style-hover=\"background:#e0e0e6;\">×<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:baseline; gap:8px; margin-top:26px; color:#86868b; font-size:13px; letter-spacing:0.02em; text-transform:uppercase;\">\n          <span style=\"font-weight:600; color:{{ acc }};\">{{ count }}<\u002Fspan>\n          <span>{{ countLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- asymmetric, scroll-swaying list -->\n      <main style=\"max-width:960px; margin:0 auto; padding:14px 28px 140px;\">\n        <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:70px 0; text-align:center; color:#a1a1a8; font-size:17px; animation:kwp-fade .5s ease both;\">Nothing here yet — try a different tag or search.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; flex-direction:column; gap:clamp(28px,4vw,50px);\">\n          <sc-for list=\"{{ items }}\" as=\"post\" hint-placeholder-count=\"6\">\n            <div class=\"kwp-card-outer\" style=\"{{ post.outerStyle }}\">\n              <div class=\"kwp-card-inner\" data-sway-idx=\"{{ post.swayi }}\" style=\"{{ post.innerStyle }}\" style-hover=\"box-shadow:0 =\"position:absolute; inset:0; z-index:1; display:block; pointer-events:{{ landingPe }}; touch-action:none;\"><\u002Fcanvas>\n\n    <button onclick=\"{{ clearPaint }}\" style=\"position:absolute; bottom:26px; right:26px; z-index:4; pointer-events:{{ landingPe }}; border:1px solid #e2e2e8; background:rgba(255,255,255,0.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#86868b; font-size:12.5px; padding:8px 15px; border-radius:20px; cursor:pointer; transition:color .2s ease, border-color .2s ease;\" style-hover=\"color:#1d1d1f; border-color:#cfcfd6;\">clear canvas<\u002Fbutton>\n\n    <div style=\"position:relative; z-index:2; max-width:760px; pointer-events:none; padding:48px 36px; border-radius:48px; background:radial-gradient(ellipse 78% 76% at 50% 46%, rgba(251,251,253,0.92) 0%, rgba(251,251,253,0.62) 52%, rgba(251,251,253,0) 78%);\">\n      <h1 style=\"margin:0; font-size:clamp(44px,8vw,100px); line-height:0.98; font-weight:600; letter-spacing:-0.04em; color:#1d1d1f;\">\n        <span style=\"display:block; animation:kwp-riseBlur 1s cubic-bezier(.16,1,.3,1) both; animation-delay:.06s;\">Kwesi’s<\u002Fspan>\n        <span style=\"display:block; animation:kwp-riseBlur 1s cubic-bezier(.16,1,.3,1) both; animation-delay:.18s;\">Weekend<\u002Fspan>\n        <span style=\"display:block; animation:kwp-riseBlur 1s cubic-bezier(.16,1,.3,1) both; animation-delay:.3s; color:{{ acc }};\">Projects<\u002Fspan>\n      <\u002Fh1>\n\n      <div style=\"margin-top:42px; animation:kwp-fade 1s ease both; animation-delay:.5s;\">\n        <button onclick=\"{{ enter }}\" style=\"display:inline-flex; align-items:center; gap:10px; border:none; cursor:pointer; pointer-events:{{ landingPe }}; background:{{ acc }}; color:#fff; font-size:17px; font-weight:500; padding:15px 30px; border-radius:30px; box-shadow:0 10px 26px rgba(0,0,0,0.12); transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease;\" style-hover=\"transform:translateY(-2px) scale(1.02); box-shadow:0 16px 34px rgba(0,0,0,0.18);\">\n          <span>Explore<\u002Fspan>\n          <span style=\"font-size:18px; line-height:1;\">→<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ======== ZIPLINE: blank paint canvas ======== -->\n  <sc-if value=\"{{ zipline }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:200; background:#fbfbfd; animation:kwp-fade .35s ease both;\">\n      <canvas id=\"kwp-zip-canvas\" style=\"position:absolute; inset:0; z-index:1; display:block; pointer-events:auto; touch-action:none;\"><\u002Fcanvas>\n\n      <div style=\"position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; pointer-events:none;\">\n        <button onclick=\"{{ closeZipline }}\" style=\"pointer-events:auto; display:inline-flex; align-items:center; gap:7px; border:1px solid #e2e2e8; background:rgba(255,255,255,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#1d1d1f; font-size:14px; font-weight:500; padding:9px 16px; border-radius:22px; cursor:pointer; transition:border-color .2s ease;\" style-hover=\"border-color:#cfcfd6;\">\n          <span style=\"font-size:16px; line-height:1;\">←<\u002Fspan>\n          <span>Back<\u002Fspan>\n        <\u002Fbutton>\n        <div style=\"font-size:12px; font-weight:600; letter-spacing:0.14em; color:#9a9aa1; text-transform:uppercase;\">The zipline<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; pointer-events:auto;\">\n          <button onclick=\"{{ clearZip }}\" style=\"border:1px solid #e2e2e8; background:rgba(255,255,255,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#86868b; font-size:14px; padding:9px 16px; border-radius:22px; cursor:pointer; transition:color .2s ease, border-color .2s ease;\" style-hover=\"color:#1d1d1f; border-color:#cfcfd6;\">Clear<\u002Fbutton>\n          <button onclick=\"{{ shareZip }}\" style=\"display:inline-flex; align-items:center; gap:8px; border:none; background:{{ acc }}; color:#fff; font-size:14px; font-weight:500; padding:9px 18px; border-radius:22px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.12); transition:transform .2s ease;\" style-hover=\"transform:translateY(-1px);\">\n            <span>Share<\u002Fspan>\n            <span style=\"font-size:15px; line-height:1;\">↑<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; left:0; right:0; bottom:28px; text-align:center; z-index:2; pointer-events:none; font-size:13px; color:#c2c2c9; letter-spacing:0.02em;\">drag &amp; click anywhere to paint · Share saves your canvas to post on Instagram<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"{{ toastStyle }}\">{{ toast }}<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#33c2ff&quot;, &quot;options&quot;: [&quot;#33c2ff&quot;, &quot;#356eff&quot;, &quot;#1d1d1f&quot;, &quot;#e8602c&quot;, &quot;#1f9e6b&quot;], &quot;tsType&quot;: &quot;string&quot; },\n  &quot;sort&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Newest&quot;, &quot;options&quot;: [&quot;Curated&quot;, &quot;Newest&quot;], &quot;tsType&quot;: &quot;string&quot; },\n  &quot;motion&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Lively&quot;, &quot;options&quot;: [&quot;Lively&quot;, &quot;Calm&quot;], &quot;tsType&quot;: &quot;string&quot; },\n  &quot;igHandle&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;yourusername&quot;, &quot;tsType&quot;: &quot;string&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { entered:false, menuOpen:false, query:'', activeTag:null, activeCat:null, zipline:false, toast:'', view:'list' };\n  canvasRef = React.createRef();\n  siteUrl = 'kwesis-weekend-projects.com';\n\n  posts = [\n    { id:'coffee', title:'Mapping My Coffee Habit', cat:'DATA', category:'data', date:'Jun 2026', rank:1, d:12, tags:['data','viz','python'] },\n    { id:'boring', title:'Why Tools Should Be Boring', cat:'WRITING', category:'essay', date:'Jun 2026', rank:2, d:11, tags:['writing','design'] },\n    { id:'weather', title:'A Tiny Weather App', cat:'APP', category:'app', date:'May 2026', rank:3, d:9, tags:['app','react'] },\n    { id:'chess', title:'What 2,000 Chess Games Taught Me', cat:'DATA', category:'data', date:'May 2026', rank:4, d:10, tags:['data','chess'] },\n    { id:'nobody', title:'On Building Things Nobody Asked For', cat:'WRITING', category:'essay', date:'Apr 2026', rank:5, d:7, tags:['writing','making'] },\n    { id:'pomodoro', title:'Pomodoro, but Calmer', cat:'APP', category:'app', date:'Apr 2026', rank:6, d:8, tags:['app','focus'] },\n    { id:'spotify', title:'A Year of Listening, Visualized', cat:'DATA', category:'data', date:'Mar 2026', rank:7, d:6, tags:['data','music','viz'] },\n    { id:'slow', title:'Notes on Slowness', cat:'WRITING', category:'essay', date:'Feb 2026', rank:8, d:4, tags:['writing','life'] },\n  ];\n\n  curatedTags = ['data','writing','app','viz','python','music'];\n  radii = ['120px 26px 120px 26px','26px 120px 26px 120px','96px 96px 22px 96px','22px 96px 96px 96px','120px 26px 90px 26px','26px 96px 26px 120px','96px 22px 96px 96px','96px 96px 96px 22px'];\n  amps = [24,17,30,19,26,21,28,18];\n  widths = [82,64,76,60,80,66,74,62];\n\n  componentDidMount() {\n    this._key = (e) => {\n      if (e.key === 'Escape') {\n        if (this.state.zipline) { this.closeZipline(); return; }\n        this.setState({ menuOpen:false }); return;\n      }\n      if (e.key === 'Enter' && !this.state.entered) { e.preventDefault(); this.enter(); }\n    };\n    document.addEventListener('keydown', this._key);\n    this._onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = null;\n        const sy = window.scrollY || window.pageYOffset || 0;\n        const vw = window.innerWidth;\n        const ms = vw < 640 ? 0 : ((this.props.motion || 'Lively') === 'Calm' ? 0.45 : 1);\n        document.querySelectorAll('[data-sway-idx]').forEach((el, i) => {\n          const amp = this.amps[i % this.amps.length];\n          const sway = Math.sin((sy + i * 200) / 230) * amp * ms;\n          const rot  = Math.sin((sy + i * 170) / 320) * 1.5 * (i % 2 ? 1 : -1) * ms;\n          el.style.transform = 'translateX(' + sway.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';\n        });\n      });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive:true });\n    this.setupPaint('kwp-canvas', true, '_landingPaint', '_landingReady');\n  }\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this._key);\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._landingPaint) this._landingPaint.cleanup();\n    if (this._zipPaint) this._zipPaint.cleanup();\n    clearTimeout(this._toastT);\n  }\n\n  setupPaint(id, doSeed, storeKey, readyKey) {\n    if (this[readyKey]) return;\n    const canvas = document.getElementById(id);\n    if (!canvas) {\n      const tk = '_tries_' + readyKey;\n      this[tk] = (this[tk] || 0) + 1;\n      if (this[tk] < 60) requestAnimationFrame(() => this.setupPaint(id, doSeed, storeKey, readyKey));\n      return;\n    }\n    this[readyKey] = true;\n    const ctx = canvas.getContext('2d');\n    const accent = this.props.accentColor || '#33c2ff';\n    const palette = ['#1d1d1f', '#1d1d1f', '#34343a', '#6b7280', accent, accent, '#d9694e', '#cf9b3e'];\n    let W = 0, H = 0, dpr = 1;\n    const rnd = (a, b) => a + Math.random() * (b - a);\n    const pick = (arr) => arr[(Math.random() * arr.length) | 0];\n\n    function blob(x, y, r, color, alpha) {\n      ctx.save();\n      ctx.globalAlpha = alpha;\n      ctx.fillStyle = color;\n      ctx.beginPath();\n      const pts = 7 + ((Math.random() * 6) | 0);\n      for (let i = 0; i <= pts; i++) {\n        const a = (i / pts) * Math.PI * 2;\n        const rr = r * rnd(0.55, 1.3);\n        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;\n        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);\n      }\n      ctx.closePath();\n      ctx.fill();\n      ctx.restore();\n    }\n    function drip(x, y, dx, dy, len, r, color, alpha) {\n      ctx.save();\n      ctx.globalAlpha = alpha;\n      ctx.strokeStyle = color;\n      ctx.lineCap = 'round';\n      ctx.lineWidth = r;\n      const ex = x + dx * len, ey = y + dy * len;\n      ctx.beginPath();\n      ctx.moveTo(x, y);\n      ctx.quadraticCurveTo(x + dx * len * 0.5 + rnd(-10, 10), y + dy * len * 0.5 + rnd(-10, 10), ex, ey);\n      ctx.stroke();\n      ctx.restore();\n      blob(ex, ey, r * rnd(0.7, 1.3), color, alpha);\n    }\n    function splat(x, y, scale, dirx, diry, intensity) {\n      const color = pick(palette);\n      blob(x, y, rnd(5, 10) * scale, color, rnd(0.68, 0.95));\n      const speed = Math.hypot(dirx, diry);\n      const baseAng = speed < 0.02 ? null : Math.atan2(diry, dirx);\n      const n = (4 + Math.random() * 9 * intensity) | 0;\n      for (let i = 0; i < n; i++) {\n        const ang = baseAng === null ? rnd(0, Math.PI * 2) : baseAng + rnd(-0.95, 0.95);\n        const dist = rnd(8, 64) * scale * (0.5 + intensity);\n        const sr = rnd(1.1, 4.6) * scale;\n        if (Math.random() < 0.28 && intensity > 0.55) {\n          drip(x, y, Math.cos(ang), Math.sin(ang), dist, sr, color, rnd(0.5, 0.8));\n        } else {\n          blob(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, sr, color, rnd(0.55, 0.9));\n        }\n      }\n      if (intensity > 0.8 && Math.random() < 0.5) {\n        const la = rnd(0, Math.PI * 2), ll = rnd(40, 130);\n        ctx.save();\n        ctx.globalAlpha = rnd(0.3, 0.55);\n        ctx.strokeStyle = pick(palette);\n        ctx.lineWidth = rnd(0.6, 1.6);\n        ctx.beginPath();\n        ctx.moveTo(x, y);\n        ctx.lineTo(x + Math.cos(la) * ll, y + Math.sin(la) * ll);\n        ctx.stroke();\n        ctx.restore();\n      }\n    }\n    function seed() {\n      if (!doSeed) return;\n      for (let i = 0; i < 6; i++) {\n        splat(rnd(W * 0.08, W * 0.92), rnd(H * 0.1, H * 0.9), rnd(0.5, 1.0), rnd(-1, 1), rnd(-1, 1), rnd(0.3, 0.65));\n      }\n    }\n    function resize() {\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      W = window.innerWidth; H = window.innerHeight;\n      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);\n      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      seed();\n    }\n\n    let lx = 0, ly = 0, have = false, acc = 0;\n    const onMove = (e) => {\n      const x = e.clientX, y = e.clientY;\n      if (have) {\n        const dx = x - lx, dy = y - ly, d = Math.hypot(dx, dy);\n        acc += d;\n        const sp = Math.min(d, 42);\n        if (acc > 13) { acc = 0; splat(x, y, 0.45 + sp / 42, dx, dy, 0.35 + sp / 30); }\n      }\n      lx = x; ly = y; have = true;\n    };\n    const onDown = (e) => {\n      const x = e.clientX, y = e.clientY;\n      splat(x, y, 1.5, rnd(-1, 1), rnd(-1, 1), 1.5);\n      for (let i = 0; i < 3; i++) { const a = rnd(0, Math.PI * 2); drip(x, y, Math.cos(a), Math.sin(a), rnd(40, 120), rnd(2, 5), pick(palette), rnd(0.6, 0.9)); }\n      lx = x; ly = y; have = true;\n    };\n    canvas.addEventListener('pointermove', onMove);\n    canvas.addEventListener('pointerdown', onDown);\n    window.addEventListener('resize', resize);\n    resize();\n\n    const exportPng = () => {\n      const out = document.createElement('canvas');\n      out.width = canvas.width; out.height = canvas.height;\n      const o = out.getContext('2d');\n      o.fillStyle = '#fbfbfd'; o.fillRect(0, 0, out.width, out.height);\n      o.drawImage(canvas, 0, 0);\n      o.setTransform(dpr, 0, 0, dpr, 0, 0);\n      o.textAlign = 'right';\n      o.font = '600 15px -apple-system, BlinkMacSystemFont, sans-serif';\n      o.fillStyle = 'rgba(29,29,31,0.62)';\n      o.fillText('made on Kwesi’s Weekend Projects', W - 24, H - 42);\n      o.font = '500 12.5px -apple-system, sans-serif';\n      o.fillStyle = 'rgba(29,29,31,0.42)';\n      o.fillText(this.siteUrl, W - 24, H - 24);\n      return out;\n    };\n    const cleanup = () => {\n      canvas.removeEventListener('pointermove', onMove);\n      canvas.removeEventListener('pointerdown', onDown);\n      window.removeEventListener('resize', resize);\n    };\n    this[storeKey] = { clear: () => { ctx.clearRect(0, 0, W, H); }, exportPng, cleanup };\n  }\n\n\n  enter() { this.setState({ entered:true }); }\n  goHome() { window.scrollTo({ top:0 }); this.setState({ entered:false, menuOpen:false, view:'list' }); }\n  toggleTag(key) { this.setState(s => ({ activeTag: s.activeTag === key ? null : (key || null) })); }\n  selectCat(cat) { this.setState({ activeCat: cat, menuOpen:false }); }\n  showProjects() { window.scrollTo({ top:0 }); this.setState({ activeCat:null, activeTag:null, query:'', menuOpen:false, view:'list' }); }\n  aboutMe() { this.setState({ view:'about', menuOpen:false }); }\n  openZipline() {\n    this._zipReady = false; this['_tries__zipReady'] = 0;\n    this.setState({ zipline:true, menuOpen:false });\n    requestAnimationFrame(() => this.setupPaint('kwp-zip-canvas', false, '_zipPaint', '_zipReady'));\n  }\n  closeZipline() {\n    if (this._zipPaint) { this._zipPaint.cleanup(); this._zipPaint = null; }\n    this._zipReady = false;\n    this.setState({ zipline:false });\n  }\n  clearZip() { if (this._zipPaint) this._zipPaint.clear(); }\n  showToast(msg) { this.setState({ toast: msg }); clearTimeout(this._toastT); this._toastT = setTimeout(() => this.setState({ toast:'' }), 4400); }\n  shareZip() {\n    const eng = this._zipPaint;\n    if (!eng) return;\n    const out = eng.exportPng();\n
